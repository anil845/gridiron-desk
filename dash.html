<style>

    --accent:#4f8474; --accent-soft:#e7efeb;

    --qb:#a76b8f; --rb:#4f7f96; --wr:#5f8a54; --te:#b0824e; --kdef:#8a938d;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#111714; --card:#181f1b; --raise:#1d2621; --ink:#e7ede8; --muted:#93a29a;
      --faint:#6d7a72; --line:#26302b; --line2:#202823; --accent:#7cb3a2; --accent-soft:#1e2a25;
      --good:#7cb090; --good-soft:#1c2a21; --warn:#d0a869; --warn-soft:#2c2618; --bad:#cc8e88; --bad-soft:#2c1f1e;
    }
  }
  :root[data-theme="dark"] {
    --paper:#111714; --card:#181f1b; --raise:#1d2621; --ink:#e7ede8; --muted:#93a29a;
    --faint:#6d7a72; --line:#26302b; --line2:#202823; --accent:#7cb3a2; --accent-soft:#1e2a25;
    --good:#7cb090; --good-soft:#1c2a21; --warn:#d0a869; --warn-soft:#2c2618; --bad:#cc8e88; --bad-soft:#2c1f1e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--paper); }
  body { background:var(--paper); color:var(--ink); font:16px/1.5 var(--sans);
         -webkit-font-smoothing:antialiased; padding:0 18px 64px; }
  .wrap { max-width:720px; margin:0 auto; }
  .num { font-variant-numeric:tabular-nums; }

  header { padding:26px 2px 14px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  .brand { font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-.01em; }
  .brand::before { content:""; display:inline-block; width:7px; height:7px; border-radius:2px;
                   background:var(--accent); margin-right:9px; vertical-align:middle; }
  .built { font-size:12px; color:var(--faint); }

  .toggle { display:inline-flex; background:var(--line2); border-radius:11px; padding:3px; gap:2px; margin:2px 2px 20px; }
  .toggle button { font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--muted);
                   border:0; background:transparent; padding:7px 16px; border-radius:8px; cursor:pointer; letter-spacing:.01em; }
  .toggle button.on { background:var(--raise); color:var(--ink); box-shadow:0 1px 3px rgba(30,50,44,.08); }

  .strip { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:20px 22px; margin-bottom:14px; }
  .label { font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin-bottom:14px; }

  /* matchup hero */
  .vs { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; }
  .side .who { font-size:13px; color:var(--muted); margin-bottom:3px; }
  .side .score { font-family:var(--serif); font-size:44px; font-weight:500; line-height:1; letter-spacing:-.02em; }
  .side.them { text-align:right; }
  .vs .mid { font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; }
  .meter { height:6px; border-radius:99px; background:var(--line); margin:18px 0 10px; overflow:hidden; display:flex; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .winline { display:flex; justify-content:space-between; align-items:baseline; }
  .winp { font-family:var(--serif); font-size:15px; font-weight:600; }
  .directive { font-size:14.5px; color:var(--ink); margin-top:12px; padding:11px 14px; background:var(--accent-soft);
               border-radius:10px; }

  .rosters { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:20px; }

  .plr:first-of-type { border-top:0; }
  .plr .pos { font-size:10px; font-weight:700; color:#fff; border-radius:4px; padding:1px 5px; min-width:26px; text-align:center; }
  .QB{background:var(--qb);} .RB{background:var(--rb);} .WR{background:var(--wr);} .TE{background:var(--te);} .K,.DEF{background:var(--kdef);}
  .plr .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plr .pt { color:var(--muted); }
  .plr .slot { font-size:10px; color:var(--faint); width:34px; letter-spacing:.04em; }
  .plr .flag { font-size:10px; color:var(--warn); font-weight:700; }
  .asof { font-size:11px; color:var(--faint); margin-top:12px; }
  .asof b { color:var(--muted); font-weight:600; }

  /* waiver cards */
  .card { border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:9px; background:var(--raise); }
  .card:last-child { margin-bottom:0; }
  .card .top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .card .who2 { font-size:15.5px; font-weight:600; }
  .vc { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:6px; }
  .vc.INSURANCE{color:var(--accent);background:var(--accent-soft);} .vc.EARLY{color:var(--good);background:var(--good-soft);}
  .vc.CONTESTED{color:var(--warn);background:var(--warn-soft);} .vc.SOLID{color:var(--good);background:var(--good-soft);}
  .vc.FRENZY{color:var(--bad);background:var(--bad-soft);} .vc.FORMAT{color:var(--faint);background:var(--line2);}
  .vc.WATCH{color:var(--muted);background:var(--line2);}
  .card .why { font-size:13px; color:var(--muted); margin-top:5px; }
  .legs { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:9px; font-size:12px; color:var(--faint); }
  .legs b { color:var(--ink); font-weight:600; }
  .bid { font-family:var(--serif); font-weight:600; color:var(--accent); }

  .stream .row { display:flex; gap:8px; padding:6px 0; border-top:1px solid var(--line2); font-size:14px; align-items:baseline; }
  .stream .row:first-child { border-top:0; }
  .stream .p2 { font-size:11px; font-weight:700; color:#fff; border-radius:4px; padding:1px 6px; }
  .stream .nm { flex:1; }
  .stream .mt { color:var(--faint); font-size:12.5px; }
  .stream .pt { color:var(--muted); font-variant-numeric:tabular-nums; }
  .need { color:var(--warn); font-weight:600; font-size:12.5px; margin-left:6px; }

  .mv { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line2); font-size:14px; }
  .mv:first-child { border-top:0; }
  .mv .d.up { color:var(--good); } .mv .d.dn { color:var(--bad); }
  .pod { display:flex; gap:9px; padding:6px 0; border-top:1px solid var(--line2); font-size:13.5px; align-items:baseline; }
  .pod:first-child { border-top:0; }
  .lean { font-size:10.5px; font-weight:700; text-transform:uppercase; padding:1px 6px; border-radius:5px; letter-spacing:.05em; }
  .lean.buy{color:var(--good);background:var(--good-soft);} .lean.sell{color:var(--bad);background:var(--bad-soft);} .lean.mixed{color:var(--muted);background:var(--line2);}
  .pod q { color:var(--muted); font-style:italic; }
  .quiet { color:var(--muted); font-size:14px; padding:2px 0 4px; line-height:1.5; }
  .watchlist { font-size:12.5px; color:var(--faint); margin-top:12px; padding-top:12px; border-top:1px solid var(--line2); }
  .chip { display:inline-block; background:var(--line2); border-radius:7px; padding:3px 9px; margin:0 5px 5px 0; color:var(--muted); }
  .chip b { color:var(--ink); font-weight:600; }
  .empty { text-align:center; color:var(--faint); padding:40px 0; font-family:var(--serif); font-size:18px; }
  footer { text-align:center; color:var(--faint); font-size:11.5px; margin-top:22px; }
</style>

      pods.forEach(function (p) {
        h += '<div class="pod"><span class="lean ' + p.lean + '">' + esc(p.lean) + '</span><span style="font-weight:600">' + esc(p.player) + '</span>' +
          '<span style="color:var(--faint);font-size:12px">' + p.n + ' show' + (p.n > 1 ? 's' : '') + '</span>' +
          (p.quote ? '<q>' + esc(p.quote) + '</q>' : '') + '</div>';
      });
      news.forEach(function (n) {
        h += '<div class="pod"><span style="font-weight:600">' + esc(n.player) + '</span><q>' + esc(n.headline.replace(/^\d{4}-\d\d-\d\d:\s*/, "")) + '</q></div>';
      });
      h += '</div>';
    }

    $("main").innerHTML = h || '<div class="empty">Quiet week.</div>';
  }

  function lineupRows(lineup, open) {
    var h = (lineup || []).map(function (p) {
      return '<div class="plr"><span class="slot">' + esc(p.slot || "") + '</span><span class="pos ' + posCls(p.pos) + '">' + esc(p.pos) + '</span>' +
        '<span class="nm">' + esc(p.name) + (p.inj ? ' <span class="flag">' + esc(p.inj === "Questionable" ? "Q" : p.inj) + '</span>' : '') + '</span><span class="pt num">' + one(p.pts) + '</span></div>';
    }).join("");
    (open || []).forEach(function (s) {
      h += '<div class="plr"><span class="slot">' + esc(s) + '</span><span class="pos ' + posCls(s) + '">' + esc(s) + '</span><span class="nm" style="color:var(--faint)">— open —</span><span class="pt"></span></div>';
    });
    return h;
  }

  function waiverCard(c) {
    var vc = c.verdict === "FORMAT MIRAGE" ? "FORMAT" : c.verdict;
    var legs = [];
    legs.push('worth <b>' + one(c.our_pts) + '</b>' + (c.improve > 0 ? ' (<b>+' + one(c.improve) + '</b> vs my starter)' : ''));
    if (c.ecr) legs.push('experts <b>#' + Math.round(c.ecr) + '</b>');
    if (c.owned != null) legs.push('rostered <b>' + Math.round(c.owned) + '%</b>' + (c.vel ? ' (' + (c.vel > 0 ? '+' : '') + c.vel.toFixed(1) + ')' : ''));
    if (c.usage != null) legs.push('snaps <b>' + (c.usage > 0 ? '+' : '') + c.usage + '</b>');
    if (c.trending) legs.push('🔥 trending');
    var bid = c.bid > 0 ? '<span class="bid">$' + c.bid + '</span>' : '<span class="built">—</span>';
    return '<div class="card"><div class="top"><span class="who2">' + esc(c.name) + ' <span style="color:var(--faint);font-weight:400">' + esc(c.pos) + '</span></span>' +
      '<span class="vc ' + vc + '">' + esc(c.verdict) + '</span></div>' +
      '<div class="why">' + esc(c.why) + (c.bid > 0 ? ' · bid ' + bid : '') + '</div>' +
      '<div class="legs">' + legs.join('<span style="color:var(--line)">·</span> ') + '</div></div>';
  }

  render();
})();
</script>
</body>
</html>
