app = "gridiron-war-room"
primary_region = "yyz"

[build]

[env]
  DATA_DIR = "/data"
  # Basic-auth creds for a private fantasy board: env (not secrets) is a
  # deliberate tradeoff — the secrets API was unreachable from this network.
  BOARD_USER = "anil"
  BOARD_PASS = "cerveza75"

[[mounts]]
  source = "board_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
