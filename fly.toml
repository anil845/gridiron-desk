app = "gridiron-war-room"
primary_region = "yyz"

[build]

[env]
  DATA_DIR = "/data"

[[mounts]]
  source = "board_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
