<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Single-theme by design: a dim-room draft cockpit. Every surface and color
     painted explicitly. Fonts are Windows-native (offline constraint). */
  :root {
    --bg:#0c0f16; --panel:#141926; --panel2:#10151f; --line:#232b3e; --line2:#2e3956;
    --ink:#e8edf8; --dim:#8b95ac; --faint:#5a6379;
    --gold:#f6c945; --gold2:#ffe084; --good:#3ddc84; --bad:#ff5d6b;
    --violet:#c792ff; --cyan:#4cc2ff;
    --qb:#f07ad2; --rb:#58c6ff; --wr:#a8e05f; --te:#ffb066; --kdef:#93a0b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { background: radial-gradient(1100px 480px at 50% -160px, #1a2238 0%, var(--bg) 62%) fixed;
         background-color: var(--bg); color: var(--ink); min-height: 100%;
         padding: 10px 14px 16px; font: 14px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .num { font-family: "Cascadia Mono", Consolas, "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }

  #lgbanner { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding: 0 2px; }
  .lg-name { font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  .lg-name::before { content: "\25C6  "; color: var(--gold); }
  .lg-meta { font-size: 12px; color: var(--dim); }

  header { display: grid; grid-template-columns: 290px 1.1fr 1.3fr; gap: 10px; margin-bottom: 10px; }
  .box { background: linear-gradient(180deg, #171d2c, #121724); border: 1px solid var(--line);
         border-radius: 14px; padding: 10px 14px;
         box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.35); }
  .box.hero { box-shadow: 0 0 0 1px rgba(246,201,69,.28), 0 0 26px rgba(246,201,69,.07), 0 6px 18px rgba(0,0,0,.4); }
  .label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #maxbid { font-size: 74px; line-height: 1; font-weight: 700; color: var(--gold2);
            text-shadow: 0 0 24px rgba(246,201,69,.25); margin: 2px 0 7px; }
  #maxbid.warn { color: var(--bad); text-shadow: 0 0 24px rgba(255,93,107,.3); }
  .hpbar { height: 8px; border-radius: 99px; background: #090c13; border: 1px solid var(--line); overflow: hidden; margin-bottom: 6px; }
  .hpbar i { display: block; height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .hpbar i.low { background: linear-gradient(90deg, var(--bad), #ffb454); }
  #maxsub { font-size: 12px; color: var(--dim); }
  #infl { font-size: 40px; font-weight: 700; margin: 4px 0 2px; }
  #inflmsg { font-size: 13px; }
  .hot { color: var(--bad); } .cold { color: var(--good); } .even { color: var(--gold); }
  #heat { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
  #heat > div { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 2px; text-align: center; }
  #heat .p { font-size: 11px; font-weight: 700; }
  #heat .v { font-size: 22px; font-weight: 700; }

  #cmdrow { display: grid; grid-template-columns: 1fr 250px; gap: 12px; align-items: start; margin-bottom: 8px; }
  #cmd { width: 100%; font-size: 26px; padding: 8px 14px; color: var(--ink); background: #0a0e17;
         border: 1px solid var(--line2); border-radius: 12px; outline: none;
         font-family: "Cascadia Mono", Consolas, monospace; }
  #cmd::placeholder { color: var(--faint); }
  #cmd:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,201,69,.15); }
  #lockchip { margin-top: 6px; padding: 6px 12px; background: rgba(246,201,69,.12); border: 1px solid rgba(246,201,69,.5);
              border-radius: 10px; font-size: 16px; color: var(--gold2); }
  #avail tr[data-pid], #noms tr[data-pid], #picker > div { cursor: pointer; }
  #status { font-size: 14px; min-height: 22px; padding: 4px; border-radius: 8px; }
  #status.err { color: var(--bad); } #status.ok { color: var(--good); }
  #status.unk { background: #4a2410; border: 1px solid #a3541f; color: #ffd9b0; font-size: 16px; font-weight: 700; padding: 8px 12px; margin-top: 4px; }
  #picker { background: #101624; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; margin-top: 4px;
            box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  #picker div { padding: 5px 12px; font-size: 16px; display: grid; grid-template-columns: 1fr 44px 46px 96px; gap: 8px; align-items: center; }
  #picker div.sel { background: var(--gold); }
  #picker div.sel, #picker div.sel * { color: #161000 !important; background-color: transparent; }
  #picker div.sel { background: var(--gold); }
  #recent { font-size: 13px; color: var(--dim); }
  #recent b { color: var(--ink); }

  main { display: grid; grid-template-columns: 1.4fr 1fr .85fr; gap: 10px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  h2 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 700;
       margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 3px 6px; text-align: left; white-space: nowrap; vertical-align: middle; }
  th { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; border-bottom: 1px solid var(--line); }
  #avail tr:nth-child(even) td, #teams tr:nth-child(even) td { background: rgba(255,255,255,.025); }
  #avail tr:hover td, #teams tr:hover td { background: #1b2336; }
  td.r, th.r { text-align: right; }
  .adj { font-size: 21px; font-weight: 700; color: var(--gold2); }
  .base { color: var(--faint); }
  .QB { color: var(--qb); } .RB { color: var(--rb); } .WR { color: var(--wr); } .TE { color: var(--te); } .K, .DEF { color: var(--kdef); }
  .pos { display: inline-block; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 7px;
         font-size: 11px; font-weight: 800; background: color-mix(in srgb, currentColor 16%, transparent); }
  .tier { display: inline-block; padding: 0 7px; border-radius: 7px; font-size: 11px; font-weight: 800; line-height: 18px; border: 1px solid; }
  .tier.t1 { color: var(--gold); border-color: rgba(246,201,69,.5); background: rgba(246,201,69,.10); }
  .tier.t2 { color: var(--violet); border-color: rgba(199,146,255,.45); background: rgba(199,146,255,.10); }
  .tier.t3 { color: var(--cyan); border-color: rgba(76,194,255,.4); background: rgba(76,194,255,.08); }
  .tier.t4 { color: var(--dim); border-color: var(--line2); background: rgba(255,255,255,.03); }
  .bar { display: inline-block; height: 8px; border-radius: 99px; background: #090c13; border: 1px solid var(--line);
         width: 56px; vertical-align: middle; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #8ef0b6); }
  .bar.low i { background: linear-gradient(90deg, var(--bad), #ff9aa3); }
  .filters button, .btns button { background: #101624; color: var(--dim); border: 1px solid var(--line2);
         border-radius: 99px; padding: 2px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .filters button:focus-visible, .btns button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .filters button.on { background: var(--gold); border-color: var(--gold); color: #161000; }
  .btns { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

  .tname { font-weight: 600; }
  .tbar { display: block; height: 4px; border-radius: 99px; background: #090c13; margin-top: 2px; overflow: hidden; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .maxcell { font-size: 19px; font-weight: 800; }
  #teams tr.me td { background: rgba(246,201,69,.09); }
  #teams tr.me td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
  .flag { color: var(--bad); font-weight: 800; }
  .dim { color: var(--faint); }
  .sprd { color: var(--violet); font-weight: 700; font-size: 12px; }
  .sprd.hi { color: var(--ink); font-weight: 800; }
  .buy { color: var(--good); font-weight: 800; } .fade { color: var(--bad); font-weight: 800; }
  tr.curve td { opacity: .42; }

  #roster { border-collapse: separate; border-spacing: 0 4px; }
  #roster td { background: var(--panel2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #roster td:first-child { border-left: 1px solid var(--line); border-radius: 8px 0 0 8px; }
  #roster td:last-child { border-right: 1px solid var(--line); border-radius: 0 8px 8px 0; }
  #roster tr.empty td { background: transparent; border-style: dashed; border-color: var(--line2); }
  #roster td.slot { color: var(--faint); width: 48px; font-size: 11px; letter-spacing: .06em; }

  #meta { font-size: 11px; color: var(--faint); margin-top: 8px; }
  #foot { font-size: 11px; color: var(--faint); margin-top: 10px; }
</style>
</head>
<body>

<div id="lgbanner"></div>

<header>
  <div class="box hero">
    <div class="label">My max bid</div>
    <div id="maxbid" class="num">—</div>
    <div class="hpbar"><i id="mybar"></i></div>
    <div id="maxsub" class="num"></div>
  </div>
  <div class="box">
    <div class="label">Live inflation</div>
    <div id="infl" class="num">—</div>
    <div id="inflmsg"></div>
  </div>
  <div class="box">
    <div class="label">Positional market heat (paid ÷ value)</div>
    <div id="heat" class="num"></div>
  </div>
</header>

<div id="cmdrow">
  <div>
    <input id="cmd" autocomplete="off" spellcheck="false" placeholder="gib 47 kev — or click a player, then type price + team   |   Ctrl+Z undo">
    <div id="lockchip" hidden></div>
    <div id="status"></div>
    <div id="picker" hidden></div>
  </div>
  <div id="recent"></div>
</div>

<main>
  <section>
    <h2>Best available <span class="filters" id="filters"></span></h2>
    <table id="avail"></table>
  </section>
  <section>
    <h2>War room · by max bid</h2>
    <table id="teams"></table>
    <h2 style="margin-top:12px">Nominate (drain them, not me)</h2>
    <table id="noms"></table>
  </section>
  <section>
    <h2>My squad</h2>
    <table id="roster"></table>
    <div class="btns">
      <button id="copy">Copy state JSON</button>
      <button id="load">Load JSON</button>
      <button id="reset">Reset board</button>
    </div>
    <div id="meta"></div>
    <div id="foot">ADP data courtesy of <b>Fantasy Football Calculator</b> (fantasyfootballcalculator.com).</div>
  </section>
</main>

<script>
// =============================================================================
// CONFIG — generated by build_board.py from leagues/<league>.json.
// Edit team_names in the league JSON, not here: a rebuild overwrites this file.
// =============================================================================
var CONFIG = /*LEAGUE_CONFIG*/{
  LEAGUE_NAME: "TEMPLATE — run build_board.py --league <name>",
  LEAGUE_ID: "42313",
  NUM_TEAMS: 12,
  BUDGET: 200,
  // Team names in draft-room order. Index ME is you; "me" always aliases it.
  // Edit these before the draft: any unique prefix works as the team token.
  TEAMS: ["Anil", "Team 2", "Team 3", "Team 4", "Team 5", "Team 6",
          "Team 7", "Team 8", "Team 9", "Team 10", "Team 11", "Team 12"],
  ME: 0,
  // Counted roster slots (IR excluded). Order matters: a pick fills the first
  // open slot whose eligibility includes the position.
  ROSTER: [
    { slot: "QB",   elig: ["QB"] },
    { slot: "RB",   elig: ["RB"] },
    { slot: "RB",   elig: ["RB"] },
    { slot: "W/T",  elig: ["WR", "TE"] },
    { slot: "W/T",  elig: ["WR", "TE"] },
    { slot: "FLEX", elig: ["RB", "WR", "TE"] },
    { slot: "K",    elig: ["K"] },
    { slot: "DEF",  elig: ["DEF"] },
    { slot: "BN", elig: ["QB","RB","WR","TE","K","DEF"] },
    { slot: "BN", elig: ["QB","RB","WR","TE","K","DEF"] },
    { slot: "BN", elig: ["QB","RB","WR","TE","K","DEF"] },
    { slot: "BN", elig: ["QB","RB","WR","TE","K","DEF"] },
    { slot: "BN", elig: ["QB","RB","WR","TE","K","DEF"] }
  ],
  OVERPAY_FLAG: 1.15,
  OVERPAY_MIN_VALUE: 20,
  DISAGREE_MIN: 0.4,
  POSITIONS: ["QB", "RB", "WR", "TE", "K", "DEF"]
}/*END_LEAGUE_CONFIG*/;

// Filled by build_board.py. Do not edit by hand.
var BOARD_DATA = /*BOARD_DATA*/null/*END_BOARD_DATA*/;

// =============================================================================
// Pure logic (no DOM) — exported for tests at the bottom.
// =============================================================================
function normName(s) {
  return String(s || "").toLowerCase().replace(/[.'’\-]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

function indexPlayers(data) {
  var byId = {}, list = data ? data.players : [];
  list.forEach(function (p) {
    p.tokens = normName(p.name).split(" ");
    if (p.position === "DEF") p.tokens.push(String(p.team || "").toLowerCase(), "def", "dst");
    byId[p.player_id] = p;
  });
  return { list: list, byId: byId };
}

// "<player-prefix> <price> <team-prefix>": the first all-digit token is the price.
function parseCommand(text) {
  var toks = text.trim().split(/\s+/).filter(Boolean);
  var pi = -1;
  for (var i = 0; i < toks.length; i++) {
    if (/^\$?\d+$/.test(toks[i])) { pi = i; break; }
  }
  if (pi < 0) return { player: toks.join(" "), price: null, team: "" };
  return {
    player: toks.slice(0, pi).join(" "),
    price: parseInt(toks[pi].replace("$", ""), 10),
    team: toks.slice(pi + 1).join(" ")
  };
}

// Every query token must prefix-match a distinct name token (any order).
// Ranked: last-name match first, then by value. Drafted players excluded.
function matchPlayers(query, players, drafted) {
  var q = normName(query).split(" ").filter(Boolean);
  if (!q.length) return [];
  var out = [];
  players.forEach(function (p) {
    if (drafted[p.player_id]) return;
    var used = {}, ok = true, lastHit = false;
    for (var i = 0; i < q.length && ok; i++) {
      var hit = -1;
      for (var j = 0; j < p.tokens.length; j++) {
        if (!used[j] && p.tokens[j].indexOf(q[i]) === 0) { hit = j; break; }
      }
      if (hit < 0) ok = false; else { used[hit] = 1; if (hit === p.tokens.length - 1 || (p.position !== "DEF" && hit === 1)) lastHit = true; }
    }
    if (ok) out.push({ p: p, last: lastHit ? 1 : 0 });
  });
  out.sort(function (a, b) { return (b.last - a.last) || (b.p.value - a.p.value) || ((a.p.vorp || 0) < (b.p.vorp || 0) ? 1 : -1); });
  return out.map(function (o) { return o.p; });
}

function matchTeam(query, cfg) {
  var q = normName(query);
  if (!q) return { err: "team?" };
  if (q === "me") return { idx: cfg.ME };
  if (/^\d+$/.test(q)) {
    var n = parseInt(q, 10);
    if (n >= 1 && n <= cfg.TEAMS.length) return { idx: n - 1 };
    return { err: "no team #" + n };
  }
  // Match on the whole name OR any word of it ("hit" -> "The Hitman").
  // Exact whole-name match wins, then an exact word match ("ra" -> "Ra Dog"
  // even though it also prefixes "Bower Rangers"), then a unique prefix.
  var hits = [];
  cfg.TEAMS.forEach(function (t, i) {
    var nn = normName(t);
    if (nn.indexOf(q) === 0 || nn.split(" ").some(function (w) { return w.indexOf(q) === 0; })) hits.push(i);
  });
  if (hits.length === 1) return { idx: hits[0] };
  if (!hits.length) return { err: "no team '" + query + "'" };
  var exact = hits.filter(function (i) { return normName(cfg.TEAMS[i]) === q; });
  if (exact.length === 1) return { idx: exact[0] };
  exact = hits.filter(function (i) { return normName(cfg.TEAMS[i]).split(" ").indexOf(q) >= 0; });
  if (exact.length === 1) return { idx: exact[0] };
  return { err: "team ambiguous: " + hits.map(function (i) { return cfg.TEAMS[i]; }).join(" / ") };
}

// Assign a team's picks to roster slots in ROSTER order (first eligible open slot).
function fillSlots(picks, byId, cfg) {
  var slots = cfg.ROSTER.map(function (s) { return { slot: s.slot, elig: s.elig, pick: null }; });
  picks.forEach(function (pk) {
    var pos = byId[pk.pid] ? byId[pk.pid].position : "?";
    for (var i = 0; i < slots.length; i++) {
      if (!slots[i].pick && (slots[i].elig.indexOf(pos) >= 0 || (pos === "?" && slots[i].slot === "BN"))) { slots[i].pick = pk; return; }
    }
    slots.push({ slot: "??", elig: [], pick: pk });   // over-rostered: still counted
  });
  return slots;
}

// Everything the display needs, from state.picks. Recomputed on every change.
function derive(state, idx, cfg) {
  var drafted = {};
  state.picks.forEach(function (pk) { drafted[pk.pid] = pk; });
  var rosterSize = cfg.ROSTER.length;

  var teams = cfg.TEAMS.map(function (name, i) {
    var picks = state.picks.filter(function (pk) { return pk.team === i; });
    var spent = 0, value = 0;
    picks.forEach(function (pk) { spent += pk.price; value += (idx.byId[pk.pid] ? idx.byId[pk.pid].value : 1); });
    var open = Math.max(0, rosterSize - picks.length);
    var money = cfg.BUDGET - spent;
    return {
      i: i, name: name, picks: picks, spent: spent, money: money, open: open,
      maxBid: open > 0 ? Math.max(0, money - (open - 1)) : 0,
      paidValue: value, overpay: value > 0 ? spent / value : null,
      slots: fillSlots(picks, idx.byId, cfg)
    };
  });
  var me = teams[cfg.ME];

  // Inflation: money that is still discretionary vs. value still on the board.
  var remainingMoney = 0, remainingSlots = 0, remainingDisc = 0;
  teams.forEach(function (t) { remainingMoney += t.money; remainingSlots += t.open; });
  idx.list.forEach(function (p) { if (!drafted[p.player_id]) remainingDisc += Math.max(0, p.value - 1); });
  var inflation = remainingDisc > 0 ? (remainingMoney - remainingSlots) / remainingDisc : null;
  var adj = function (p) { return inflation === null ? p.value : 1 + (p.value - 1) * inflation; };

  // Positional heat: realized paid/value per position.
  var heat = {};
  cfg.POSITIONS.forEach(function (pos) { heat[pos] = { paid: 0, value: 0, n: 0 }; });
  state.picks.forEach(function (pk) {
    var p = idx.byId[pk.pid]; if (!p || !heat[p.position]) return;
    heat[p.position].paid += pk.price; heat[p.position].value += p.value; heat[p.position].n++;
  });

  // Tier counts: (position, tier) -> total / remaining.
  var tiers = {};
  idx.list.forEach(function (p) {
    if (p.tier == null) return;
    var k = p.position + ":" + p.tier;
    tiers[k] = tiers[k] || { total: 0, left: 0 };
    tiers[k].total++; if (!drafted[p.player_id]) tiers[k].left++;
  });

  var available = idx.list.filter(function (p) { return !drafted[p.player_id]; })
    .map(function (p) { return { p: p, adj: adj(p) }; })
    .sort(function (a, b) { return (b.adj - a.adj) || ((b.p.vorp || 0) - (a.p.vorp || 0)); });

  // Nominations: high value, at positions where all MY starting slots are already full.
  var openStart = {};
  cfg.POSITIONS.forEach(function (pos) { openStart[pos] = 0; });
  me.slots.forEach(function (s) { if (s.slot !== "BN" && !s.pick) s.elig.forEach(function (pos) { openStart[pos]++; }); });
  var noms = available.filter(function (a) { return openStart[a.p.position] === 0 && a.p.value > 1; }).slice(0, 8);

  return {
    drafted: drafted, teams: teams, me: me,
    myMaxBid: me.maxBid, inflation: inflation, adj: adj,
    remainingMoney: remainingMoney, remainingSlots: remainingSlots, remainingDisc: remainingDisc,
    heat: heat, tiers: tiers, available: available, noms: noms
  };
}

// =============================================================================
// DOM / app
// =============================================================================
if (typeof document !== "undefined") (function () {
  var KEY = "draftboard:" + CONFIG.LEAGUE_ID;
  var IDX = indexPlayers(BOARD_DATA);
  var state = { picks: [] };
  var redo = [];
  var filter = "ALL";
  var pendingUnknown = null;
  var locked = null;   // player chosen by clicking a row; input then only needs "price team"
  var pickerSel = 0, cands = [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var money = function (v) { return "$" + Math.round(v); };
  var x = function (v, d) { return v === null || v === undefined || !isFinite(v) ? "—" : v.toFixed(d === undefined ? 2 : d) + "x"; };

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ picks: state.picks, savedAt: new Date().toISOString() })); }
    catch (e) { setStatus("localStorage write failed: " + e.message, "err"); }
  }
  function restore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && Array.isArray(s.picks)) state.picks = s.picks; }
    } catch (e) { /* start empty */ }
  }
  function setStatus(msg, cls) { var el = $("status"); el.textContent = msg; el.className = cls || ""; }

  function commit(p, price, team) {
    state.picks.push({ pid: p.player_id, name: p.name, pos: p.position, price: price, team: team, at: Date.now() });
    locked = null; renderLock();
    redo = [];
    save(); render();
    setStatus(p.name + " " + money(price) + " → " + CONFIG.TEAMS[team], "ok");
  }
  function undo() {
    if (!state.picks.length) { setStatus("nothing to undo", "err"); return; }
    var pk = state.picks.pop(); redo.push(pk);
    save(); render();
    setStatus("UNDONE: " + pk.name + " " + money(pk.price) + " → " + CONFIG.TEAMS[pk.team], "err");
  }
  function redoLast() {
    if (!redo.length) return;
    var pk = redo.pop(); state.picks.push(pk); save(); render();
    setStatus("REDONE: " + pk.name + " " + money(pk.price) + " → " + CONFIG.TEAMS[pk.team], "ok");
  }

  // --- input ---------------------------------------------------------------
  function commitUnknown() {
    if (!pendingUnknown) { setStatus("nothing pending — Enter on an unmatched name first", "err"); return; }
    var u = pendingUnknown; pendingUnknown = null;
    $("cmd").value = ""; cands = []; $("picker").hidden = true;
    state.picks.push({ pid: "unk:" + normName(u.name) + ":" + state.picks.length,
                       name: u.name, pos: "?", price: u.price, team: u.team,
                       at: Date.now(), unknown: true });
    redo = [];
    save(); render();
    setStatus("UNKNOWN committed: " + u.name + " " + money(u.price) + " → " + CONFIG.TEAMS[u.team], "ok");
  }
  function renderLock() {
    var el = $("lockchip");
    if (locked) {
      el.hidden = false;
      el.innerHTML = '<b>' + esc(locked.name) + '</b> <span class="pos ' + locked.position + '">' + locked.position + '</span> — type <b>price team</b> (e.g. 47 kev), Enter commits · Esc cancels';
    } else { el.hidden = true; el.innerHTML = ""; }
  }
  function lockPlayer(p) {
    locked = p; pendingUnknown = null;
    $("cmd").value = ""; cands = []; $("picker").hidden = true;
    renderLock(); setStatus("");
    $("cmd").focus();
  }
  function onInput() {
    pendingUnknown = null;
    var d = derive(state, IDX, CONFIG);
    var cmd = parseCommand($("cmd").value);
    if (locked && cmd.player) { locked = null; renderLock(); }   // typing a name overrides the click-lock
    cands = cmd.player ? matchPlayers(cmd.player, IDX.list, d.drafted).slice(0, 7) : [];
    pickerSel = 0;
    renderPicker(d, cmd);
  }
  function renderPicker(d, cmd) {
    var el = $("picker");
    if (!cands.length) { el.hidden = true; el.innerHTML = ""; return; }
    var t = cmd.team ? matchTeam(cmd.team, CONFIG) : null;
    var tail = (cmd.price !== null ? " " + money(cmd.price) : " price?") + (t ? (t.err ? " · " + t.err : " → " + CONFIG.TEAMS[t.idx]) : " · team?");
    el.innerHTML = cands.map(function (p, i) {
      return '<div class="' + (i === pickerSel ? "sel" : "") + '"><span>' + esc(p.name) + (i === pickerSel ? '<span class="dim">' + esc(tail) + '</span>' : "") +
        '</span><span class="pos ' + p.position + '">' + p.position + '</span><span>' + esc(p.team || "") + '</span><span class="num r">' + money(d.adj(p)) + ' <span class="base">/' + money(p.value) + '</span></span></div>';
    }).join("");
    el.hidden = false;
  }
  function onEnter() {
    var cmd = parseCommand($("cmd").value);
    if (locked && !cmd.player) {
      if (cmd.price === null || cmd.price < 1) { setStatus(locked.name + ": price? (e.g. 47 kev)", "err"); return; }
      var tl = matchTeam(cmd.team, CONFIG);
      if (tl.err) { setStatus(locked.name + ": " + tl.err, "err"); return; }
      var dl = derive(state, IDX, CONFIG), tml = dl.teams[tl.idx];
      if (cmd.price > tml.money) { setStatus(CONFIG.TEAMS[tl.idx] + " only has " + money(tml.money) + " — check the price", "err"); return; }
      if (tml.open === 0) { setStatus(CONFIG.TEAMS[tl.idx] + " has no open slots — check the team", "err"); return; }
      var lp = locked;
      $("cmd").value = ""; cands = []; $("picker").hidden = true;
      commit(lp, cmd.price, tl.idx);
      return;
    }
    if (!cmd.player) { setStatus("player?", "err"); return; }
    if (!cands.length) {
      // Unknown player (deep sleeper not in the dataset). Never committed by
      // Enter — a typo of a real name must not slip in on muscle memory.
      // Offer a Ctrl+Enter confirmation instead, on a loud banner.
      var t0 = matchTeam(cmd.team, CONFIG);
      if (cmd.price !== null && cmd.price >= 1 && !t0.err) {
        var d0 = derive(state, IDX, CONFIG), tm = d0.teams[t0.idx];
        if (cmd.price > tm.money) { setStatus(CONFIG.TEAMS[t0.idx] + " only has " + money(tm.money) + " — check the price", "err"); return; }
        if (tm.open === 0) { setStatus(CONFIG.TEAMS[t0.idx] + " has no open slots — check the team", "err"); return; }
        pendingUnknown = { name: cmd.player, price: cmd.price, team: t0.idx };
        setStatus("UNKNOWN PLAYER “" + cmd.player + "” — Ctrl+Enter commits " + money(cmd.price) + " → " + CONFIG.TEAMS[t0.idx] + " · Enter does nothing (typo?)", "unk");
      } else {
        setStatus("no player matches '" + cmd.player + "'" + (cmd.price === null ? " · price?" : "") + (t0.err ? " · " + t0.err : ""), "err");
      }
      return;
    }
    if (cmd.price === null || cmd.price < 1) { setStatus("price? (e.g. gib 47 kev)", "err"); return; }
    var t = matchTeam(cmd.team, CONFIG);
    if (t.err) { setStatus(t.err, "err"); return; }
    var p = cands[pickerSel];
    var d = derive(state, IDX, CONFIG);
    var team = d.teams[t.idx];
    if (cmd.price > team.money) { setStatus(CONFIG.TEAMS[t.idx] + " only has " + money(team.money) + " — check the price", "err"); return; }
    if (team.open === 0) { setStatus(CONFIG.TEAMS[t.idx] + " has no open slots — check the team", "err"); return; }
    $("cmd").value = ""; cands = []; $("picker").hidden = true;
    commit(p, cmd.price, t.idx);
  }
  $("cmd").addEventListener("input", onInput);
  $("cmd").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitUnknown(); }
    else if (e.key === "Enter") { e.preventDefault(); onEnter(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (cands.length) { pickerSel = (pickerSel + 1) % cands.length; renderPicker(derive(state, IDX, CONFIG), parseCommand($("cmd").value)); } }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (cands.length) { pickerSel = (pickerSel - 1 + cands.length) % cands.length; renderPicker(derive(state, IDX, CONFIG), parseCommand($("cmd").value)); } }
    else if (e.key === "Escape") { locked = null; renderLock(); $("cmd").value = ""; onInput(); setStatus(""); }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { e.preventDefault(); redoLast(); }
  });
  // Click a player row -> lock them into the chip; then just "price team" + Enter.
  function rowClick(e) {
    var tr = e.target && e.target.closest ? e.target.closest("tr[data-pid]") : null;
    if (!tr) return;
    var p = IDX.byId[tr.getAttribute("data-pid")];
    if (p) lockPlayer(p);
  }
  $("avail").addEventListener("click", rowClick);
  $("noms").addEventListener("click", rowClick);
  $("picker").addEventListener("click", function (e) {
    var row = e.target && e.target.closest ? e.target.closest("#picker > div") : null;
    if (!row) return;
    pickerSel = Array.prototype.indexOf.call($("picker").children, row);
    var c = parseCommand($("cmd").value);
    if (c.price !== null && c.team) onEnter();          // price+team already typed: commit
    else if (cands[pickerSel]) lockPlayer(cands[pickerSel]);   // else lock the clicked candidate
  });
  // Keep the box focused. Clicking a filter button steals focus for one click only.
  document.addEventListener("click", function () { setTimeout(function () { $("cmd").focus(); }, 0); });
  window.addEventListener("focus", function () { $("cmd").focus(); });

  // --- buttons -------------------------------------------------------------
  $("copy").addEventListener("click", function () {
    var txt = JSON.stringify({ league: CONFIG.LEAGUE_ID, savedAt: new Date().toISOString(), picks: state.picks }, null, 1);
    var done = function () { setStatus("state copied (" + state.picks.length + " picks)", "ok"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt("Copy this:", txt); });
    else window.prompt("Copy this:", txt);
  });
  $("load").addEventListener("click", function () {
    var txt = window.prompt("Paste state JSON (replaces current board):");
    if (!txt) return;
    try {
      var s = JSON.parse(txt);
      if (!Array.isArray(s.picks)) throw new Error("no picks array");
      state.picks = s.picks; redo = []; save(); render(); setStatus("loaded " + s.picks.length + " picks", "ok");
    } catch (e) { setStatus("bad JSON: " + e.message, "err"); }
  });
  $("reset").addEventListener("click", function () {
    if (!window.confirm("Reset the whole board? (" + state.picks.length + " picks). Copy the JSON first if you want it.")) return;
    state.picks = []; redo = []; save(); render(); setStatus("board reset", "err");
  });
  var fl = $("filters");
  ["ALL"].concat(CONFIG.POSITIONS).concat(["DIS"]).forEach(function (pos) {
    var b = document.createElement("button"); b.textContent = pos; b.dataset.pos = pos;
    b.addEventListener("click", function () { filter = pos; render(); });
    fl.appendChild(b);
  });

  // --- render ----------------------------------------------------------------
  function render() {
    var d = derive(state, IDX, CONFIG);
    var me = d.me;

    var mb = $("maxbid"); mb.textContent = money(d.myMaxBid); mb.className = "num" + (d.myMaxBid <= 10 ? " warn" : "");
    var hp = $("mybar"); hp.style.width = Math.max(0, Math.min(100, 100 * me.money / CONFIG.BUDGET)) + "%";
    hp.className = me.money <= 40 ? "low" : "";
    $("maxsub").textContent = money(me.money) + " left · " + me.open + " slots · " + (me.open > 1 ? "$1 held for " + (me.open - 1) + " more" : me.open === 1 ? "last slot" : "roster full");

    var inf = $("infl"), msg = $("inflmsg");
    if (d.inflation === null) { inf.textContent = "—"; inf.className = "num"; msg.textContent = "no discretionary value left on the board"; }
    else {
      var cls = d.inflation > 1.05 ? "hot" : d.inflation < 0.95 ? "cold" : "even";
      inf.textContent = d.inflation.toFixed(2) + "x"; inf.className = "num " + cls;
      msg.className = cls;
      msg.textContent = (d.inflation > 1.05 ? "market is hot, pay up" : d.inflation < 0.95 ? "bargains available" : "market at par") +
        "  ·  " + money(d.remainingMoney) + " chasing " + money(d.remainingDisc) + " of value · " + d.remainingSlots + " slots";
    }

    $("heat").innerHTML = CONFIG.POSITIONS.map(function (pos) {
      var h = d.heat[pos], r = h.value > 0 ? h.paid / h.value : null;
      var cls = r === null ? "dim" : r > 1.05 ? "hot" : r < 0.95 ? "cold" : "even";
      return '<div><div class="p ' + pos + '">' + pos + ' <span class="dim">' + h.n + '</span></div><div class="v ' + cls + '">' + x(r) + '</div></div>';
    }).join("");

    // best available
    fl.querySelectorAll("button").forEach(function (b) { b.className = b.dataset.pos === filter ? "on" : ""; });
    var rows = d.available.filter(function (a) {
      if (filter === "DIS") return (a.p.disagreement || 0) >= CONFIG.DISAGREE_MIN;
      return filter === "ALL" || a.p.position === filter;
    }).slice(0, 45);
    $("avail").innerHTML = '<tr><th class="r">Pay</th><th>Player</th><th>Pos</th><th>Tm</th><th class="r">Bye</th><th class="r">Val</th><th class="r">±</th><th class="r">VORP</th><th>Tier</th></tr>' +
      rows.map(function (a) {
        var p = a.p, tk = p.position + ":" + p.tier, t = d.tiers[tk];
        var bar = t ? '<span class="bar' + (t.left <= 1 ? " low" : "") + '"><i style="width:' + Math.round(100 * t.left / t.total) + '%"></i></span> <span class="dim">' + t.left + '/' + t.total + '</span>' : "";
        var srcs = p.sources ? Object.keys(p.sources).map(function (k) { return k + " " + p.sources[k]; }).join("  ") : "";
        // P = model (projection) rank, M = market consensus (fc/ffc/sadp mean).
        // ▲ proj better than market (buy) / ▼ proj worse (fade). Caveat: when
        // the market sources cluster and only proj diverges, trust the market.
        var sp = "";
        if (p.disagreement != null) {
          var pr = p.sources && p.sources.proj, mk = p.mkt_rank;
          var arrow = (pr != null && mk != null && pr !== mk) ? (pr < mk ? '<span class="buy">▲</span>' : '<span class="fade">▼</span>') : "";
          var lbl = (pr != null && mk != null) ? ("P" + pr + "/M" + mk) : p.disagreement.toFixed(2);
          sp = '<span class="sprd' + (p.disagreement >= CONFIG.DISAGREE_MIN ? " hi" : "") + '" title="' + esc(srcs) + '">' + arrow + lbl + '</span>';
        }
        var mut = p.points_source === "curve";   // no projection: rank-curve scale, not comparable
        return '<tr data-pid="' + p.player_id + '"' + (mut ? ' class="curve"' : "") + '><td class="r num adj">' + money(a.adj) + '</td><td title="' + esc(srcs) + '">' + esc(p.name) + (mut ? " *" : "") + '</td><td class="pos ' + p.position + '">' + p.position + '</td><td>' + esc(p.team || "") +
          '</td><td class="r num dim">' + (p.bye || "") + '</td><td class="r num base">' + money(p.value) + '</td><td class="r num">' + sp + '</td><td class="r num dim">' + (p.vorp == null ? "" : Math.round(p.vorp)) +
          '</td><td class="num">' + (p.tier == null ? "" : '<span class="tier t' + Math.min(p.tier, 4) + '">T' + p.tier + '</span> ' + bar) + '</td></tr>';
      }).join("");

    // teams
    var ts = d.teams.slice().sort(function (a, b) { return (b.maxBid - a.maxBid) || (b.money - a.money); });
    $("teams").innerHTML = '<tr><th>Team</th><th class="r">Max</th><th class="r">$ left</th><th class="r">Slots</th><th class="r">Paid/Val</th></tr>' +
      ts.map(function (t) {
        // ratio shown from the first pick; ⚠ only once they've bought >= OVERPAY_MIN_VALUE of value ($3 on a $1 DEF is not a tell)
        var op = t.overpay === null ? '<span class="dim">—</span>'
          : t.paidValue < CONFIG.OVERPAY_MIN_VALUE ? '<span class="dim">' + x(t.overpay) + '</span>'
          : t.overpay >= CONFIG.OVERPAY_FLAG ? '<span class="flag">' + x(t.overpay) + ' ⚠</span>' : x(t.overpay);
        var bw = Math.max(0, Math.min(100, 100 * t.money / CONFIG.BUDGET));
        return '<tr' + (t.i === CONFIG.ME ? ' class="me"' : "") + '><td><div class="tname">' + esc(t.name) + '</div><span class="tbar"><i style="width:' + bw + '%"></i></span></td><td class="r num maxcell">' + money(t.maxBid) +
          '</td><td class="r num">' + money(t.money) + '</td><td class="r num">' + t.open + '</td><td class="r num">' + op + '</td></tr>';
      }).join("");

    // nominations
    $("noms").innerHTML = d.noms.length ? d.noms.map(function (a) {
      return '<tr data-pid="' + a.p.player_id + '"><td class="r num adj" style="font-size:18px">' + money(a.adj) + '</td><td>' + esc(a.p.name) + '</td><td class="pos ' + a.p.position + '">' + a.p.position + '</td><td class="dim">' + esc(a.p.team || "") + '</td></tr>';
    }).join("") : '<tr><td class="dim">— fill a starting position first —</td></tr>';

    // my roster
    $("roster").innerHTML = me.slots.map(function (s) {
      var pk = s.pick, p = pk ? IDX.byId[pk.pid] : null;
      return '<tr' + (pk ? "" : ' class="empty"') + '><td class="slot">' + s.slot + '</td><td>' + (pk ? esc(pk.name) + ' <span class="pos ' + (p ? p.position : "") + '">' + (p ? p.position : "") + '</span>' : '<span class="dim">—</span>') +
        '</td><td class="r num">' + (pk ? money(pk.price) + (p ? ' <span class="base">/' + money(p.value) + '</span>' : "") : "") + '</td></tr>';
    }).join("") + '<tr><td class="slot">Σ</td><td class="dim">' + me.picks.length + ' players</td><td class="r num">' + money(me.spent) + '</td></tr>';

    // recent
    var rec = state.picks.slice(-6).reverse();
    $("recent").innerHTML = '<div class="label">Last picks · #' + state.picks.length + '</div>' + (rec.length ? rec.map(function (pk) {
      return '<div><b>' + esc(pk.name) + '</b> <span class="num">' + money(pk.price) + '</span> → ' + esc(CONFIG.TEAMS[pk.team]) + '</div>';
    }).join("") : '<div class="dim">none yet</div>');

    var m = BOARD_DATA && BOARD_DATA.meta;
    $("meta").textContent = m ? "data " + m.generated_at + " · " + m.players + " players · " + m.num_teams + " teams · repl " +
      Object.keys(m.replacement_rank_starter).map(function (k) { return k + m.replacement_rank_starter[k]; }).join(" ") : "NO BOARD DATA — run build_board.py";
  }

  document.title = CONFIG.LEAGUE_NAME + " — Draft Board";
  $("lgbanner").innerHTML = '<span class="lg-name">' + esc(CONFIG.LEAGUE_NAME) + '</span>' +
    '<span class="lg-meta num">' + CONFIG.NUM_TEAMS + ' teams · $' + CONFIG.BUDGET + ' · built ' +
    esc(BOARD_DATA && BOARD_DATA.meta ? BOARD_DATA.meta.generated_at.replace("T", " ") : "NO DATA") + '</span>';
  restore();
  render();
  if (!BOARD_DATA) setStatus("NO BOARD DATA embedded — run python build_board.py", "err");
  else if (state.picks.length) setStatus("restored " + state.picks.length + " picks from this browser", "ok");
  $("cmd").focus();
})();

if (typeof module !== "undefined") module.exports = { CONFIG: CONFIG, normName: normName, indexPlayers: indexPlayers, parseCommand: parseCommand, matchPlayers: matchPlayers, matchTeam: matchTeam, fillSlots: fillSlots, derive: derive, data: function () { return BOARD_DATA; } };
</script>
</body>
</html>
